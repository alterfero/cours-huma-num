<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="title desc">
<title id="title">Exemple d’encodage TEI : un nom de personne</title>
<desc id="desc">Extrait de l’exemple officiel persName du TEI Consortium : les prénoms Edward et George sont balisés par forename, le nom Bulwer-Lytton par surname.</desc>
<rect x="1" y="1" width="758" height="438" rx="8" fill="#132429" stroke="#61767a"/>
<text x="32" y="45" fill="#e6ae80" font-family="monospace" font-size="17">TEI / NOM DE PERSONNE</text>
<path d="M32 65H728" stroke="#425759"/>
<text x="32" y="108" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">&lt;persName&gt;</text>
<text x="32" y="151" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">  &lt;forename&gt;Edward&lt;/forename&gt;</text>
<text x="32" y="194" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">  &lt;forename&gt;George&lt;/forename&gt;</text>
<text x="32" y="237" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">  &lt;surname type=&quot;linked&quot;&gt;</text>
<text x="32" y="280" fill="#f1e8d8" font-family="monospace" font-size="23" xml:space="preserve">    Bulwer-Lytton</text>
<text x="32" y="323" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">  &lt;/surname&gt;</text>
<text x="32" y="366" fill="#86b7ac" font-family="monospace" font-size="23" xml:space="preserve">&lt;/persName&gt;</text>
</svg>
